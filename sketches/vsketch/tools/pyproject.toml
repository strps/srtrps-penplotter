[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plottools"
version = "0.1.0"
description = "Reusable helpers for pen plotter sketches"
requires-python = ">=3.10"
dependencies = ["numpy", "shapely>=2.0"]

[tool.setuptools]
packages = ["plottools"]
